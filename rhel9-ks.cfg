#version=RHEL9
# Use graphical install
graphical
repo --name="AppStream" --baseurl=file:///run/install/sources/mount-0000-cdrom/AppStream
%addon com_redhat_kdump --enable --reserve-mb='auto'
%end
# Keyboard layouts
keyboard --xlayouts='us'
# System language
lang en_US.UTF-8

# Explicitly install the bootloader on the master boot record of the first disk
bootloader --location=mbr --driveorder=vda,sda --append="rhgb quiet"

# Partitioning commands must also reference the correct device
part / --fstype="xfs" --grow --ondisk=vda

# Network information
network  --bootproto=dhcp --device=ens192 --ipv6=auto --activate
network  --hostname=SRV-RHEL-001

# Use CDROM installation media
cdrom
%packages
@^server-product-environment
%end
# Run the Setup Agent on first boot
firstboot --enable

# Generated using Blivet version 3.6.0
ignoredisk --only-use=sda
autopart
# Partition clearing information
clearpart --none --initlabel

# System timezone
timezone Asia/Yangon --utc

#Root password
rootpw --lock
user --groups=wheel --name=redhat --password=redhat --gecos="redhat"
